[package]
name        = "schema-nv"
version     = "0.1.0"
description = "JSON Schema 2020-12's validation and applicator vocabularies over the standard library's JSON value, with reasons: every failure names the instance location, the schema location and the keyword, as a list rather than a first failure.  Compile once, validate many; $ref resolved inside the document and across a set the caller registered, with the core naming what it needs so the host can fetch it; format as a registry the caller extends."
license     = "Apache-2.0"

# `experimental` because no program outside this repository has used the
# package yet, and the tests were written against the signatures rather
# than by a consumer.
stability   = "experimental"

# `core`: a `$ref` names a URI, and resolving one to another document
# means reading it.  `schcompile.external_refs` answers which URIs a
# schema needs and the host fetches them, so a schema from outside cannot
# make a program fetch a URL.
layer       = "core"

category    = "data"

tags        = ["json-schema", "2020-12", "validation", "schema", "annotations", "agent-tools", "sans-io"]
repository  = "https://github.com/novolang/schema-nv"
maintainers = ["novo-lang"]
# 0.13.0 is the first toolchain on which a value `json.get` answers
# keeps its document alive, which the annotations rely on.
novo        = ">= 0.13.0"

# A library: no `main`, so `novo pkg build` type-checks and
# effect-checks every module under `src/` and writes no binary.

[docs.pages]
"README.md" = "Validating a JSON document, and saying why it did not match"

[dependencies]
# None.  The value validated is the standard library's `std.json`, so a
# caller converts nothing before checking a document.  `pattern` uses
# `std.regex`, whose differences from ECMA-262 the README names.  The
# formats with long or disputed grammars, such as `uri` and
# `idn-hostname`, arrive through `schformat.with_format` from whichever
# package a caller chooses, rather than as dependencies here.
